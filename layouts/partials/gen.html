<script>
  const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
  const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);

  const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // --- palette --------------------------------------------------------
  // Weighted HSB colors. Teal + black/white carry the composition, gold and
  // terracotta are rare sparks (gold echoes the favicon), aqua adds air.
  const PALETTE_LIGHT = [
    { c: [190, 78, 52], w: 0.34 }, // teal
    { c: "black", w: 0.24 },
    { c: [187, 35, 92], w: 0.16 }, // ice aqua
    { c: [42, 78, 88], w: 0.13 }, // gold (favicon echo)
    { c: [14, 68, 78], w: 0.08 }, // terracotta
    { c: [0, 0, 97], w: 0.05 }, // white fleck
  ];
  const PALETTE_DARK = [
    { c: [190, 65, 74], w: 0.34 }, // teal
    { c: [0, 0, 93], w: 0.22 }, // near-white
    { c: [196, 45, 62], w: 0.16 }, // dim aqua
    { c: [42, 75, 88], w: 0.14 }, // gold
    { c: [14, 65, 82], w: 0.08 }, // terracotta
    { c: [220, 30, 16], w: 0.06 }, // charcoal fleck
  ];
  let palette = PALETTE_LIGHT;

  const SHAPE_WEIGHTS = [
    ["quarter", 0.22],
    ["rect", 0.18],
    ["circle", 0.2],
    ["triangle", 0.16],
    ["ring", 0.14],
    ["plus", 0.1],
  ];

  let shapes = [];
  let prevShapes = null;
  let transition = null; // { start: frameCount, dur }
  let energy = 0.35; // idle pulse intensity, eased toward a target
  let energyTarget = 0.35;
  let nextSeed = 99;
  let canvasElement;
  let ready = false; // p5 hasn't attached its globals (randomSeed, etc.) until setup() has run

  function pickWeighted(entries, roll) {
    let acc = 0;
    for (const [value, w] of entries) {
      acc += w;
      if (roll <= acc) return value;
    }
    return entries[entries.length - 1][0];
  }

  function pickColor() {
    let acc = 0;
    const roll = random();
    for (const entry of palette) {
      acc += entry.w;
      if (roll <= acc) return entry.c;
    }
    return palette[0].c;
  }

  function updatePalette() {
    const isDark =
      document.documentElement.getAttribute("data-theme") === "dark" ||
      (window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches &&
        !document.documentElement.getAttribute("data-theme"));
    palette = isDark ? PALETTE_DARK : PALETTE_LIGHT;
  }

  function buildCell(x, y, size, depth) {
    const r = size * 1.01;
    const rnd = [...Array(8)].map(() => random());

    if (rnd[6] > 0.8 && depth > 0) return; // leave some negative space
    if (rnd[1] > 0.5 && depth <= 2) {
      buildCell(x, y, size / 2, depth + 1);
      buildCell(x + size / 2, y, size / 2, depth + 1);
      buildCell(x + size / 2, y + size / 2, size / 2, depth + 1);
      buildCell(x, y + size / 2, size / 2, depth + 1);
      return;
    }

    const type = pickWeighted(SHAPE_WEIGHTS, random());
    shapes.push({
      cx: x + r / 2,
      cy: y + r / 2,
      r,
      type,
      color: pickColor(),
      orientation: floor(random(4)),
      rot: type === "triangle" || type === "plus" ? random(-0.35, 0.35) : 0,
      strokeOnly: type !== "ring" && random() < 0.16,
      phase: random(TWO_PI),
      pulseAmt: random(0.08, 0.22),
    });
  }

  function generate(seed) {
    randomSeed(seed);
    shapes = [];
    buildCell(0, 0, width, 0);
  }

  function regenerate(seed) {
    if (!ready) return; // theme/system listeners can fire before p5's setup() runs
    prevShapes = shapes;
    generate(seed);
    if (!reducedMotion) {
      transition = { start: frameCount, dur: 20 };
    }
    if (reducedMotion) redraw();
  }

  function drawShape(s) {
    switch (s.type) {
      case "quarter": {
        const a = s.orientation * HALF_PI;
        arc(0, 0, s.r * 1.9, s.r * 1.9, a, a + HALF_PI);
        break;
      }
      case "rect":
        rect(0, 0, s.r, s.r);
        break;
      case "circle":
        circle(0, 0, s.r);
        break;
      case "triangle":
        triangle(0, -s.r / 2, s.r * 0.45, s.r / 4, -s.r * 0.45, s.r / 4);
        break;
      case "ring":
        circle(0, 0, s.r * 0.82);
        break;
      case "plus":
        rect(0, 0, s.r * 0.92, s.r * 0.24);
        rect(0, 0, s.r * 0.24, s.r * 0.92);
        break;
    }
  }

  function drawSet(list, t, extraScale) {
    for (const s of list) {
      push();
      translate(s.cx, s.cy);
      const pulse = reducedMotion ? 1 : 1 + Math.sin(t + s.phase) * s.pulseAmt * energy;
      scale(pulse * extraScale);
      rotate(s.rot);
      if (s.type === "ring") {
        noFill();
        stroke(s.color);
        strokeWeight(2);
      } else if (s.strokeOnly) {
        noFill();
        stroke(s.color);
        strokeWeight(1.5);
      } else {
        noStroke();
        fill(s.color);
      }
      drawShape(s);
      pop();
    }
  }

  function draw() {
    clear();
    const t = frameCount * 0.045;
    energy += (energyTarget - energy) * 0.06;

    let mix = 1;
    if (transition) {
      mix = (frameCount - transition.start) / transition.dur;
      if (mix >= 1) {
        transition = null;
        prevShapes = null;
        mix = 1;
      }
    }

    if (transition && prevShapes) {
      drawSet(prevShapes, t, Math.max(0, 1 - mix * 1.4));
    }
    drawSet(shapes, t, transition ? Math.min(1, mix * 1.4) : 1);

    if (reducedMotion && !transition) noLoop();
  }

  function setup() {
    createCanvas(190, 190).parent("p5-container");
    canvasElement = document.getElementById("p5-container").getElementsByTagName("canvas")[0];
    const seedAttr = canvasElement.parentElement.dataset.seed;
    if (seedAttr) nextSeed = parseInt(seedAttr, 10);
    colorMode(HSB);
    rectMode(CENTER);
    angleMode(RADIANS);
    frameRate(30);
    updatePalette();
    generate(nextSeed);
    ready = true;
    if (reducedMotion) noLoop();
  }

  function getDistance(ax, ay, bx, by) {
    return Math.sqrt((ax - bx) ** 2 + (ay - by) ** 2);
  }

  function mouseMoved({ clientX, clientY }) {
    if (!canvasElement) return;
    const { left, right, top, bottom } = canvasElement.getBoundingClientRect();
    const center = { x: (left + right) / 2, y: (bottom + top) / 2 };
    const dist = getDistance(center.x, center.y, clientX, clientY);
    const maxLength = 0.8 * getDistance(center.x, center.y, vw, center.y);
    const proximity = Math.max(0, Math.min(1, 1 - dist / maxLength));
    energyTarget = 0.3 + proximity * 1.1;
    if (reducedMotion) redraw();
  }

  function mouseClicked() {
    nextSeed = random(0, 1000000);
    regenerate(nextSeed);
  }

  const themeObserver = new MutationObserver((mutations) => {
    mutations.forEach((m) => {
      if (m.type === "attributes" && m.attributeName === "data-theme") {
        updatePalette();
        regenerate(nextSeed);
      }
    });
  });
  themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  if (window.matchMedia) {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      updatePalette();
      regenerate(nextSeed);
    });
  }
</script>
<div id="p5-container" data-seed="{{ . | default 99 }}"></div>
